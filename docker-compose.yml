# Local development only. Production Postgres is Supabase (ADR-0005).
services:
  postgres:
    image: postgres:17-alpine
    container_name: doen_thang_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doen_thang
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doen_thang"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
